name: Build and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate JSON from Excel
        run: python scripts/generate-data.py

      - name: Build static site
        env:
          GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}
        run: |
          mkdir -p _site/data _site/config
          cp index.html _site/
          cp -R css js _site/
          cp data/shuttle-data.json _site/data/
          python - <<'PY'
          import json, os, pathlib
          key = os.environ.get("GOOGLE_MAPS_BROWSER_KEY", "").strip()
          pathlib.Path("_site/config/google-maps-config.json").write_text(
              json.dumps({"apiKey": key}, ensure_ascii=False), encoding="utf-8"
          )
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
